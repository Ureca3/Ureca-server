spring:
  application:
    name: unity

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    hikari:
      pool-name: hikari-pool
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 5000
      connection-init-sql: SELECT 1
      idle-timeout: 300000
      max-lifetime: 600000
      auto-commit: true

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.ureca.unity.domain

server:
  port: ${PORT:8080}

logging:
  level:
    root: info
    com:
      zaxxer:
        hikari: DEBUG
    org.springframework.jdbc: DEBUG

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

cookie:
  secure: ${COOKIE_SECURE:true}
oauth:
  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    token-uri: https://nid.naver.com/oauth2.0/token
    user-info-uri: https://openapi.naver.com/v1/nid/me
    redirect-uri: ${NAVER_REDIRECT_URI}

  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    token-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
    redirect-uri: ${GOOGLE_REDIRECT_URI}

  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    # client-secret: ""
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
    redirect-uri: ${KAKAO_REDIRECT_URI}
    admin-key: ${KAKAO_ADMIN_KEY}

jwt:
  issuer: unity
  secret: ${JWT_SECRET}
  access-expiration-seconds: 3600       # 1시간
  refresh-expiration-seconds: 604800    # 7일

agora:
  appId: ${AGORA_APP_ID}
  appCert: ${AGORA_APP_CERT}
  customerId: ${AGORA_CUSTOMER_ID}
  customerSecret: ${AGORA_CUSTOMER_SECRET}

aws:
  s3:
    bucket: ${S3_BUCKET}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    region: ${S3_REGION}

google:
  cloud:
    credentials:
      location: ${GOOGLE_CLOUD_LOCATION}
    project-id: ${GOOGLE_CLOUD_PROJECT_ID}
    bucket-name: ${GOOGLE_CLOUD_BUCKET_NAME}

gemini:
  api-key: ${GEMINI_API_KEY}

security:
  oauth-token:
    secret: ${OAUTH_TOKEN_SECRET}
